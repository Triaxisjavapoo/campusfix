<!DOCTYPE html>
<html lang="es">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CampusFix: reporta y da seguimiento a incidencias y solicitudes de servicio del campus.">
  <meta name="theme-color" content="#087f6d">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="manifest" href="manifest.json">
  <title>CampusFix · Gestión del campus</title>
  <style>body{margin:0;background:#f4f7f5;font-family:Arial,sans-serif}.loading{height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;color:#102e2a}.mark{border-radius:16px;background:#087f6d;color:white;padding:17px 21px;font-size:26px;font-weight:bold}.loading h1{font-size:24px;letter-spacing:-1px}.loading p{font-size:13px;color:#617a70}.progress{width:100px;height:3px;background:#cee3d8;overflow:hidden}.progress:after{content:'';display:block;height:3px;width:40px;background:#087f6d;animation:p 1s infinite}@keyframes p{to{transform:translateX(110px)}}</style>
</head>
<body>
  <div class="loading" id="loading"><div class="mark">c</div><h1>campusfix</h1><p>Preparando tu espacio de trabajo…</p><div class="progress"></div></div>
  <noscript>CampusFix necesita JavaScript habilitado para acceder a Firebase.</noscript>
  <script>window.addEventListener('flutter-first-frame',()=>document.getElementById('loading')?.remove());</script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
